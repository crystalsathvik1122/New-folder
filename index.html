<!DOCTYPE html>
<html lang="en">
<head>
    <title>my pet page</title>

    <style>
        body{
            font-family:arial, sans-serif;
            background-color:lightyellow;
            padding:65px 30px 30px 30px;
            min-height:1800px
        }

        h1, h2{color:darkorange;}

        .top-bar{
            position:fixed;
            top:0;
            left:0;
            right:0;
            background-color:darkorange;
            color:white;
            padding:14px 20px;
        }

        .list-item{
            background-color:white;
            border:2px solid darkorange;
            padding:10px 20px;
            margin:5px 0;
        }

        .special-note{
            position:relative;
            left:30px;
            background-color:gold;
            padding:10px 20px;
        }

        .pet-card{
            position:relative;
            background-color:white;
            border:3px solid darkorange;
            padding:15px 20px;
        }

        .badge{
            position:absolute;
            top:8px;
            right:8px;
            background-color:forestgreen;
            color:white;
            padding:10px 20px;
            margin:15px 0 8px;
        }
    </style>
</head>
<body>
    <div class="top-bar">my pet page-buddy the labrador</div>

    <h1>meet buddy!</h1>

    <h2>static</h2>
    <div class="list-item">breed:labrador</div>
    <div class="list-item">age:2 year old</div>

    <h2>relative</h2>

    <p>this note shifts right from its normal spot</p>


</body>
</html>
